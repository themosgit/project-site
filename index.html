<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark Performance Analysis - Part 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
    
<body class="bg-gray-100">
    
    <div id="app" class="p-6 w-full"></div>
    <script>
        const RESULTS_PATH = './benchmark_results/';
        
        const BENCHMARK_FILES = [
            'results_cuckoo_arm64_2025-11-02_15-36-46.json',
            'results_cuckoo_base_arm64_2025-11-02_15-36-46.json',
            'results_cuckoo_base_x86_64_2025-11-02_21-03-08.json',
            'results_cuckoo_base_x86_64_2025-11-03_01-13-59.json',
            'results_cuckoo_x86_64_2025-11-02_21-03-08.json',
            'results_cuckoo_x86_64_2025-11-03_01-13-59.json',
            'results_fast_arm64_2025-11-02_15-26-24.json',
            'results_fast_arm64_2025-11-02_15-36-46.json',
            'results_fast_x86_64_2025-11-02_21-03-08.json',
            'results_fast_x86_64_2025-11-03_01-13-59.json',
            'results_hopscotch_arm64_2025-11-02_15-36-46.json',
            'results_hopscotch_arm64_2025-11-03_01-13-50.json',
            'results_hopscotch_base_arm64_2025-11-02_15-36-46.json',
            'results_hopscotch_base_x86_64_2025-11-02_21-03-08.json',
            'results_hopscotch_base_x86_64_2025-11-03_01-13-59.json',
            'results_hopscotch_x86_64_2025-11-02_21-03-08.json',
            'results_hopscotch_x86_64_2025-11-03_01-13-59.json',
            'results_robinhood_arm64_2025-11-02_15-26-24.json',
            'results_robinhood_arm64_2025-11-02_15-36-46.json',
            'results_robinhood_arm64_2025-11-02_22-36-44.json',
            'results_robinhood_arm64_2025-11-02_23-13-28.json',
            'results_robinhood_arm64_2025-11-03_01-13-50.json',
            'results_robinhood_arm64_2025-11-03_23-40-32.json',
            'results_robinhood_base_arm64_2025-11-02_15-36-46.json',
            'results_robinhood_base_arm64_2025-11-02_22-36-44.json',
            'results_robinhood_base_arm64_2025-11-03_23-40-32.json',
            'results_robinhood_base_x86_64_2025-11-02_21-03-08.json',
            'results_robinhood_base_x86_64_2025-11-03_01-13-59.json',
            'results_robinhood_base_x86_64_2025-11-04_00-15-42.json',
            'results_robinhood_x86_64_2025-11-02_21-03-08.json',
            'results_robinhood_x86_64_2025-11-03_01-13-59.json',
            'results_robinhood_x86_64_2025-11-04_00-15-42.json' ];


        const state = {
            allResults: [],
            selectedExecutables: {},
            selectedArchitecture: 'arm64',
            comparisonMode: 'fastest', // 'fastest' or 'slowest'
            sortBy: 'absolute',
            showTop: 5,
            currentPage: 0,
            error: '',
            activeTableTab: null,
            visibleExecutables: [],
            isWideScreen: window.matchMedia('(min-width: 601px)').matches,
        };

        let totalRuntimeChart = null;
        let queryPerformanceChart = null;

        const app = document.getElementById('app');

        async function loadAllResults() {
            // New logic: Use the embedded list of files instead of fetching the directory HTML.
            try {
                const links = BENCHMARK_FILES.filter(href => href.endsWith('.json'));

                if (links.length === 0) {
                    state.error = `No benchmark result files defined in BENCHMARK_FILES array.`;
                    render();
                    return;
                }

                const allData = await Promise.all(
                    links.map(async (file) => {
                        // Corrected: file already includes the filename, just need the path prefix
                        const res = await fetch(`${RESULTS_PATH}${file}`);
                        if (!res.ok) {
                             throw new Error(`Failed to fetch ${file}: ${res.statusText}`);
                        }
                        const data = await res.json();
                        return { filename: file, ...data };
                    })
                );

                state.allResults = allData;
                processResults();
                render();
            } catch (e) {
                state.error = `Failed to load all results from '${RESULTS_PATH}': ${e.message}`;
                render();
            }
        }

        function processResults() {
            const byExecAndArch = {};

            state.allResults.forEach(result => {
                const exec = result.executable;
                const arch = result.architecture;
                const key = `${exec}_${arch}`;

                if (!byExecAndArch[key]) {
                    byExecAndArch[key] = [];
                }
                byExecAndArch[key].push(result);
            });

            Object.keys(byExecAndArch).forEach(key => {
                byExecAndArch[key].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            });

            state.selectedExecutables = {};
            // Updated default executable to 'fast' if available, as 'fast' is present in your file list.
            const defaultExecutable = 'fast'; 
            const archResults = byExecAndArch[`${defaultExecutable}_${state.selectedArchitecture}`];
            if (archResults && archResults.length > 0) {
                state.selectedExecutables[defaultExecutable] = archResults[0];
            } else {
                 // Fallback if 'fast' isn't available for the default architecture
                 const allExecutables = getAvailableExecutables();
                 if (allExecutables.length > 0) {
                     const firstExec = allExecutables[0];
                     const firstArchResults = byExecAndArch[`${firstExec}_${state.selectedArchitecture}`];
                     if (firstArchResults && firstArchResults.length > 0) {
                        state.selectedExecutables[firstExec] = firstArchResults[0];
                     }
                 }
            }


            state.byExecAndArch = byExecAndArch;
            // Set visible executables based on the initial selection
            state.visibleExecutables = Object.keys(state.selectedExecutables);
        }

        function getAvailableArchitectures() {
            return [...new Set(state.allResults.map(r => r.architecture))];
        }

        function getAvailableExecutables() {
            return [...new Set(state.allResults.map(r => r.executable))];
        }

        function getResultsForExecutable(exec, arch) {
            const key = `${exec}_${arch}`;
            return state.byExecAndArch[key] || [];
        }

        function changeExecutableVersion(exec, filename) {
            const result = state.allResults.find(r => r.filename === filename);
            if (result) {
                state.selectedExecutables[exec] = result;
                render();
            }
        }

        function getAnalysis() {
            const selectedExecs = Object.values(state.selectedExecutables);
            if (selectedExecs.length === 0) return [];

            const allQueries = new Set();
            selectedExecs.forEach(exec => {
                // Check if statistics and per_query exist before accessing
                if (exec.statistics && exec.statistics.per_query) {
                    Object.keys(exec.statistics.per_query).forEach(query => allQueries.add(query));
                }
            });

            const comparisonResults = [];

            allQueries.forEach(query => {
                let referenceValue = null;
                let referenceExecutable = null;

                selectedExecs.forEach(execResult => {
                    const queryStats = execResult.statistics?.per_query?.[query];
                    if (queryStats) {
                        const avg = queryStats.average;
                        if (referenceValue === null) {
                            referenceValue = avg;
                            referenceExecutable = execResult.executable;
                        } else if (state.comparisonMode === 'fastest' && avg < referenceValue) {
                            referenceValue = avg;
                            referenceExecutable = execResult.executable;
                        } else if (state.comparisonMode === 'slowest' && avg > referenceValue) {
                            referenceValue = avg;
                            referenceExecutable = execResult.executable;
                        }
                    }
                });

                if (referenceValue === null) return;

                const comparisons = {};
                selectedExecs.forEach(execResult => {
                    const exec = execResult.executable;
                    const queryStats = execResult.statistics?.per_query?.[query];
                    
                    if (queryStats) {
                        const value = queryStats.average;
                        const diff = value - referenceValue;
                        const percentDiff = referenceValue === 0 ? 0 : ((diff / referenceValue) * 100);

                        comparisons[exec] = {
                            value,
                            diff,
                            percentDiff,
                            isReference: exec === referenceExecutable
                        };
                    } else {
                         comparisons[exec] = {
                            value: null,
                            diff: null,
                            percentDiff: null,
                            isReference: false
                        };
                    }
                });

                comparisonResults.push({
                    query,
                    referenceValue,
                    referenceExecutable,
                    comparisons
                });
            });

            return comparisonResults;
        }

        function getTotalRuntimeComparison() {
            const selectedExecs = Object.values(state.selectedExecutables);
            if (selectedExecs.length === 0) return null;

            let referenceTotal = null;
            let referenceExecutable = null;

            selectedExecs.forEach(execResult => {
                const total = execResult.statistics?.total_runtime?.average ? execResult.statistics.total_runtime.average / 1000 : null; // Convert to seconds
                if (total !== null) {
                    if (referenceTotal === null) {
                        referenceTotal = total;
                        referenceExecutable = execResult.executable;
                    } else if (state.comparisonMode === 'fastest' && total < referenceTotal) {
                        referenceTotal = total;
                        referenceExecutable = execResult.executable;
                    } else if (state.comparisonMode === 'slowest' && total > referenceTotal) { 
                        referenceTotal = total;
                        referenceExecutable = execResult.executable;
                    }
                }
            });

            if (referenceTotal === null) return null;

            const comparisons = {};
            selectedExecs.forEach(execResult => {
                const exec = execResult.executable;
                const total = execResult.statistics?.total_runtime?.average ? execResult.statistics.total_runtime.average / 1000 : null; // Convert to seconds
                
                if (total !== null) {
                    const diff = total - referenceTotal;
                    const percentDiff = referenceTotal === 0 ? 0 : ((diff / referenceTotal) * 100);

                    comparisons[exec] = {
                        value: total,
                        diff,
                        percentDiff,
                        isReference: exec === referenceExecutable
                    };
                } else {
                     comparisons[exec] = {
                        value: null,
                        diff: null,
                        percentDiff: null,
                        isReference: false
                    };
                }
            });

            return {
                referenceTotal,
                referenceExecutable,
                comparisons
            };
        }

        function render() {
            if (state.allResults.length === 0) {
                app.innerHTML = getLoadingView();
            } else {
                app.innerHTML = getAnalysisView();
                addAnalysisEventListeners();
                renderCharts();
            }
        }

        function getLoadingView() {
            return `
                <div class="p-6 max-w-4xl mx-auto">
                    <h1 class="text-3xl font-bold mb-2">Benchmark Performance Analysis</h1>
                    ${state.error ? `
                        <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 text-red-800">${state.error}</div>
                    `: `
                        <p class="text-gray-600 mb-6">Loading benchmark results from <code>${RESULTS_PATH}</code> using embedded file list...</p>
                    `}
                </div>
            `;
        }

        function getAnalysisView() {
            const analysis = getAnalysis();
            const sortedAnalysis = [...analysis].sort((a, b) => {
                const getWorstDiff = (item) => {
                    const diffs = Object.values(item.comparisons)
                                        .filter(c => !c.isReference && c.diff !== null)
                                        .map(c => state.sortBy === 'absolute' ? c.diff : c.percentDiff);
                    if (diffs.length === 0) return 0;
                    if (state.comparisonMode === 'fastest') {
                        return Math.max(0, ...diffs);
                    } else { // slowest
                        return Math.min(0, ...diffs);
                    }
                };
                return getWorstDiff(b) - getWorstDiff(a);
            });

            const totalPages = Math.ceil(sortedAnalysis.length / state.showTop);
            const startIndex = state.currentPage * state.showTop;
            const endIndex = startIndex + state.showTop;
            const paginatedQueries = sortedAnalysis.slice(startIndex, endIndex);
            const totalRuntimeComparison = getTotalRuntimeComparison();
            const allExecutables = getAvailableExecutables();
            const architectures = getAvailableArchitectures();
            const selectedExecNames = Object.keys(state.selectedExecutables);

            if (!state.activeTableTab && selectedExecNames.length > 0) {
                state.activeTableTab = selectedExecNames[0];
            } else if (selectedExecNames.length === 0) {
                state.activeTableTab = null;
            }

            const tableHtml = state.isWideScreen 
                ? getWideTableView(paginatedQueries, selectedExecNames) 
                : getNarrowTableView(paginatedQueries, selectedExecNames);

            return `
                <div class="mb-6">
                    <h1 class="text-3xl font-bold mb-2">Benchmark Performance Analysis - Part 1</h1>
                    <p class="text-gray-600">Comparing executable performance</p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-1 space-y-6">
                        <div class="bg-white border rounded-lg p-4">
                            <h2 class="text-lg font-semibold mb-3">Architecture</h2>
                            <div class="flex gap-2">
                                ${architectures.map(arch => `
                                    <button data-arch="${arch}" class="arch-btn px-4 py-2 rounded ${state.selectedArchitecture === arch ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700'}">
                                        ${arch}
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-white border rounded-lg p-4">
                            <h2 class="text-lg font-semibold mb-3">Filter Algorithms</h2>
                            <div class="flex flex-wrap gap-2">
                                ${allExecutables.map(exec => `
                                    <button data-exec="${exec}" class="executable-filter-btn px-3 py-1.5 rounded text-sm ${state.visibleExecutables.includes(exec) ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700'}">
                                        ${exec}
                                    </button>
                                `).join('')}
                            </div>
                        </div>


                        <div class="bg-white border rounded-lg p-4">
                            <h2 class="text-lg font-semibold mb-3">Comparison Mode</h2>
                            <div class="flex gap-4">
                                <label class="inline-flex items-center">
                                    <input type="radio" name="comparisonMode" value="fastest" class="form-radio text-blue-600" ${state.comparisonMode === 'fastest' ? 'checked' : ''}>
                                    <span class="ml-2">Show relative to <span class="font-bold">Fastest</span></span>
                                </label>
                                <label class="inline-flex items-center">
                                    <input type="radio" name="comparisonMode" value="slowest" class="form-radio text-blue-600" ${state.comparisonMode === 'slowest' ? 'checked' : ''}>
                                    <span class="ml-2">Show relative to <span class="font-bold">Slowest</span></span>
                                </label>
                            </div>
                        </div>

                        <div class="bg-white border rounded-lg p-4">
                            <h2 class="text-lg font-semibold mb-3">Executables & Versions</h2>
                            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-1 gap-3">
                                ${state.visibleExecutables.map(exec => {
                                    const results = getResultsForExecutable(exec, state.selectedArchitecture);
                                    const selected = state.selectedExecutables[exec];
                                    return `
                                        <div class="border rounded p-3">
                                            <div class="flex items-center justify-between mb-2">
                                                <span class="font-semibold">${exec}</span>
                                                ${selected ? `<span class="text-xs text-gray-500">${selected.timestamp}</span>` : ''}
                                            </div>
                                            <select data-exec="${exec}" class="exec-version-select border rounded px-2 py-1 text-sm w-full">
                                                ${results.length === 0 ? '<option>No results for this architecture</option>' : ''}
                                                ${results.map(r => `
                                                    <option value="${r.filename}" ${selected?.filename === r.filename ? 'selected' : ''}>
                                                        ${r.timestamp} (${r.statistics?.total_runtime?.median?.toFixed(0) || 'N/A'}ms, ${r.iterations_measured} iterations)
                                                    </option>
                                                `).join('')}
                                            </select>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>

                    <div class="lg:col-span-2 space-y-6">
                        ${totalRuntimeComparison ? `
                        <div class="bg-white border rounded-lg p-4">
                            <h2 class="text-xl font-semibold mb-3">Total Runtime Comparison (Relative to ${state.comparisonMode === 'fastest' ? 'Fastest' : 'Slowest'})</h2>
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <div class="space-y-2">
                                    ${Object.entries(totalRuntimeComparison.comparisons).sort(([, a], [, b]) => {
                                        if (state.comparisonMode === 'fastest') {
                                            return (a.value ?? Infinity) - (b.value ?? Infinity);
                                        } else {
                                            return (b.value ?? -Infinity) - (a.value ?? -Infinity);
                                        }
                                    }).map(([branch, data]) => `
                                        <div class="flex items-center justify-between p-2 rounded ${data.isReference ? 'bg-green-100 border border-green-300' : (data.diff > 0 ? 'bg-red-50' : 'bg-green-50')}">
                                            <span class="font-semibold ${data.isReference ? 'text-green-800' : ''}">${branch} ${data.isReference ? `(${state.comparisonMode === 'fastest' ? 'Fastest' : 'Slowest'})` : ''}:</span>
                                            <div class="text-right">
                                                <span class="mr-4">${data.value !== null ? data.value.toFixed(3) + 's' : 'N/A'}</span>
                                                ${!data.isReference && data.diff !== null ? `
                                                    <span class="${data.diff > 0 ? 'text-red-600' : 'text-green-600'}">
                                                        ${data.diff > 0 ? '+' : ''}${data.diff.toFixed(3)}s
                                                        (${data.diff > 0 ? '+' : ''}${data.percentDiff.toFixed(2)}%)
                                                    </span>
                                                ` : ''}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                                <div>
                                    <canvas id="totalRuntimeChart"></canvas>
                                </div>
                            </div>
                        </div>
                        ` : ''}

                        <div class="bg-white border rounded-lg p-4">
                            <h2 class="text-xl font-semibold mb-4">Query Performance Comparison (Relative to ${state.comparisonMode === 'fastest' ? 'Fastest' : 'Slowest'})</h2>
                            <div class="relative h-[400px]">
                                <canvas id="queryPerformanceChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-6">
                    <div class="flex flex-wrap justify-center sm:justify-between items-end gap-4 mb-4">
                        <div class="flex gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-2">Sort By:</label>
                                <select id="sort-by-select" class="border rounded px-3 py-2">
                                    <option value="absolute" ${state.sortBy === 'absolute' ? 'selected' : ''}>Absolute Difference (ms)</option>
                                    <option value="percent" ${state.sortBy === 'percent' ? 'selected' : ''}>Percent Difference (%)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-2">Show Per Page:</label>
                                <select id="show-top-select" class="border rounded px-3 py-2">
                                    <option value="5" ${state.showTop === 5 ? 'selected' : ''}>5</option>
                                    <option value="10" ${state.showTop == 10 ? 'selected' : ''}>10</option>
                                    <option value="20" ${state.showTop == 20 ? 'selected' : ''}>20</option>
                                    <option value="30" ${state.showTop == 30 ? 'selected' : ''}>30</option>
                                    <option value="50" ${state.showTop == 50 ? 'selected' : ''}>50</option>
                                    <option value="${sortedAnalysis.length}" ${state.showTop == sortedAnalysis.length ? 'selected' : ''}>All (${sortedAnalysis.length})</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 w-full sm:justify-end justify-center">
                            <button id="prev-page-btn" class="px-3 py-1.5 border rounded bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" ${state.currentPage === 0 ? 'disabled' : ''}>
                                Previous
                            </button>
                            <span class="text-sm text-gray-600">Page ${state.currentPage + 1} of ${totalPages}</span>
                            <button id="next-page-btn" class="px-3 py-1.5 border rounded bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed" ${state.currentPage >= totalPages - 1 ? 'disabled' : ''}>
                                Next
                            </button>
                        </div>
                    </div>

                    <div class="bg-white border rounded-lg overflow-x-auto">
                        ${tableHtml}
                    </div>
                </div>
            `;
        }

        function getWideTableView(paginatedQueries, selectedExecNames) {
            if (selectedExecNames.length === 0) {
                return '<p class="p-4 text-gray-500">Select an executable to see detailed query results.</p>';
            }

            return `
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-sm font-semibold sticky left-0 bg-gray-50 z-10">Query</th>
                            ${selectedExecNames.map(exec => `
                                <th colspan="3" class="px-4 py-3 text-center text-sm font-semibold border-l">${exec}</th>
                            `).join('')}
                        </tr>
                        <tr>
                            <th class="px-4 py-2 text-left text-xs font-semibold sticky left-0 bg-gray-50 z-10"></th>
                            ${selectedExecNames.map(() => `
                                <th class="px-4 py-2 text-right text-xs font-semibold border-l">Time (ms)</th>
                                <th class="px-4 py-2 text-right text-xs font-semibold">Ref</th>
                                <th class="px-4 py-2 text-right text-xs font-semibold">Δ Avg</th>
                            `).join('')}
                        </tr>
                    </thead>
                    <tbody class="divide-y">
                        ${paginatedQueries.map((item, idx) => `
                            <tr class="${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}">
                                <td class="px-4 py-3 font-mono font-semibold text-sm sticky left-0 z-10 ${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}">${item.query}</td>
                                ${selectedExecNames.map(exec => {
                                    const data = item.comparisons[exec];
                                    if (!data) return '<td colspan="3" class="px-4 py-3 border-l text-center text-gray-400">-</td>';
                                    return `
                                        <td class="px-4 py-3 text-right border-l ${data.isReference ? 'font-bold text-green-700' : ''}">${data.value !== null ? data.value.toFixed(1) : '-'}</td>
                                        <td class="px-4 py-3 text-right text-xs">${item.referenceExecutable} (${item.referenceValue.toFixed(1)})</td>
                                        <td class="px-4 py-3 text-right">
                                            ${!data.isReference && data.diff !== null ? `
                                                <span class="${data.diff > 0 ? 'text-red-600' : 'text-green-600'}">
                                                    ${data.diff > 0 ? '+' : ''}${data.diff.toFixed(1)}
                                                    <span class="text-xs ml-1">(${data.diff > 0 ? '+' : ''}${data.percentDiff.toFixed(1)}%)</span>
                                                </span>
                                            ` : (data.isReference ? '<span class="text-green-700">Ref</span>' : '-')}
                                        </td>
                                    `;
                                }).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        function getNarrowTableView(paginatedQueries, selectedExecNames) {
             if (selectedExecNames.length === 0) {
                return '<p class="p-4 text-gray-500">Select an executable to see detailed query results.</p>';
            }
            return `
                <div class="md:hidden border-b">
                    <div class="flex -mb-px overflow-x-auto">
                        ${selectedExecNames.map(exec => `
                            <button data-tab-target="${exec}" class="table-tab-btn whitespace-nowrap py-3 px-4 font-semibold text-sm ${state.activeTableTab === exec ? 'border-b-2 border-blue-500 text-blue-600' : 'text-gray-500'}">
                                ${exec}
                            </button>
                        `).join('')}
                    </div>
                </div>
                ${selectedExecNames.map(exec => `
                    <div class="${state.activeTableTab === exec ? 'block' : 'hidden'}">
                        <table class="w-full">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-4 py-3 text-left text-sm font-semibold">Query</th>
                                    <th class="px-4 py-3 text-right text-sm font-semibold">${exec} (ms)</th>
                                    <th class="px-4 py-3 text-right text-sm font-semibold">Reference</th>
                                    <th class="px-4 py-3 text-right text-sm font-semibold">Δ Avg</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                ${paginatedQueries.map((item, idx) => {
                                    const data = item.comparisons[exec];
                                    if (!data) return '';
                                    return `
                                        <tr class="${idx % 2 === 0 ? 'bg-white' : 'bg-gray-50'}">
                                            <td class="px-4 py-3 font-mono font-semibold">${item.query}</td>
                                            <td class="px-4 py-3 text-right ${data.isReference ? 'font-bold text-green-700' : ''}">${data.value !== null ? data.value.toFixed(1) : '-'}</td>
                                            <td class="px-4 py-3 text-right font-semibold">${item.referenceExecutable} (${item.referenceValue.toFixed(1)})</td>
                                            <td class="px-4 py-3 text-right font-semibold">
                                                ${!data.isReference && data.diff !== null ? `
                                                    <span class="${data.diff > 0 ? 'text-red-600' : 'text-green-600'}">
                                                        ${data.diff > 0 ? '+' : ''}${data.diff.toFixed(1)}
                                                        <span class="text-xs ml-1">(${data.diff > 0 ? '+' : ''}${data.percentDiff.toFixed(1)}%)</span>
                                                    </span>
                                                ` : (data.isReference ? 'Reference' : '-')}
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                `).join('')}
            `;
        }

        function addAnalysisEventListeners() {
            document.querySelectorAll('input[name="comparisonMode"]').forEach(radio => {
                radio.addEventListener('change', (e) => {
                    state.comparisonMode = e.target.value;
                    state.currentPage = 0;
                    state.activeTableTab = null;
                    render();
                });
            });

            document.querySelectorAll('.arch-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.selectedArchitecture = e.target.dataset.arch;
                    state.activeTableTab = null;
                    processResults();
                    render();
                });
            });

            document.querySelectorAll('.executable-filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const exec = e.target.dataset.exec;
                    toggleExecutableVisibility(exec);
                    render();
                });
            });

            document.querySelectorAll('.exec-version-select').forEach(select => {
                select.addEventListener('change', (e) => {
                    const exec = e.target.dataset.exec;
                    const filename = e.target.value;
                    changeExecutableVersion(exec, filename);
                    // No need to reset activeTableTab here, as the executable is still selected, just the version changed.
                });
            });

            document.getElementById('sort-by-select').addEventListener('change', (e) => {
                state.sortBy = e.target.value;
                state.currentPage = 0;
                render();
            });

            document.getElementById('show-top-select').addEventListener('change', (e) => {
                state.showTop = Number(e.target.value);
                state.currentPage = 0;
                render();
            });

            document.getElementById('prev-page-btn').addEventListener('click', () => {
                if (state.currentPage > 0) {
                    state.currentPage--;
                    render();
                }
            });

            document.getElementById('next-page-btn').addEventListener('click', () => {
                const totalPages = Math.ceil(getAnalysis().length / state.showTop);
                if (state.currentPage < totalPages - 1) {
                    state.currentPage++;
                    render();
                }
            });

            document.querySelectorAll('.table-tab-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    state.activeTableTab = e.currentTarget.dataset.tabTarget;
                    render();
                });
            });
        }

        function toggleExecutableVisibility(exec) {
            const index = state.visibleExecutables.indexOf(exec);
            if (index > -1) {
                state.visibleExecutables.splice(index, 1);
                // Also remove it from the active selection
                delete state.selectedExecutables[exec];
                // Update the active table tab if the removed executable was active
                if (state.activeTableTab === exec) {
                    const remainingExecs = Object.keys(state.selectedExecutables);
                    state.activeTableTab = remainingExecs.length > 0 ? remainingExecs[0] : null;
                }
            } else {
                state.visibleExecutables.push(exec);
                // Re-select the latest version for this newly visible architecture
                const archResults = getResultsForExecutable(exec, state.selectedArchitecture);
                if (archResults && archResults.length > 0) state.selectedExecutables[exec] = archResults[0];
            }
        }

        function renderCharts() {
            const colors = ['#6366f1', '#f43f5e', '#14b8a6', '#f59e0b', '#0ea5e9', '#d946ef'];
            const referenceColor = '#22c55e';

            const totalRuntimeComparison = getTotalRuntimeComparison();
            const totalRuntimeCtx = document.getElementById('totalRuntimeChart')?.getContext('2d');
            if (totalRuntimeCtx && totalRuntimeComparison) {
                const chartData = Object.entries(totalRuntimeComparison.comparisons)
                    .filter(([, data]) => data.value !== null)
                    .map(([branch, data]) => ({ branch, time: data.value, isReference: data.isReference }));

                if (totalRuntimeChart) totalRuntimeChart.destroy();
                totalRuntimeChart = new Chart(totalRuntimeCtx, {
                    type: 'bar',
                    data: {
                        labels: chartData.map(d => d.branch),
                        datasets: [{
                            label: 'Total Time (s)',
                            data: chartData.map(d => d.time),
                            backgroundColor: chartData.map((d, i) => d.isReference ? referenceColor : colors[i % colors.length]),
                            borderRadius: 4,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                callbacks: {
                                    label: (context) => `${context.raw.toFixed(3)} s`
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: { display: true, text: 'Total Time (s)' }
                            }
                        }
                    }
                });
            }

            const analysis = getAnalysis();
            const sortedAnalysis = [...analysis].sort((a, b) => {
                 const getWorstDiff = (item) => {
                    const diffs = Object.values(item.comparisons)
                                        .filter(c => !c.isReference && c.diff !== null)
                                        .map(c => state.sortBy === 'absolute' ? c.diff : c.percentDiff);
                    if (diffs.length === 0) return 0;
                    if (state.comparisonMode === 'fastest') {
                        return Math.max(0, ...diffs);
                    } else { // slowest
                        return Math.min(0, ...diffs);
                    }
                };
                return getWorstDiff(b) - getWorstDiff(a);
            });

            const startIndex = state.currentPage * state.showTop;
            const endIndex = startIndex + state.showTop;
            const queriesForChart = sortedAnalysis.slice(startIndex, endIndex);

            const queryPerfCtx = document.getElementById('queryPerformanceChart')?.getContext('2d');
            if (queryPerfCtx && queriesForChart.length > 0) {
                const selectedExecNames = Object.keys(state.selectedExecutables);
                const chartData = {
                    labels: queriesForChart.map(item => item.query),
                    datasets: selectedExecNames.map((exec, idx) => ({
                        label: exec,
                        data: queriesForChart.map(item => {
                            const data = item.comparisons[exec];
                            return data ? data.value : null;
                        }),
                        backgroundColor: queriesForChart.map(item => {
                            const data = item.comparisons[exec];
                            return data && data.isReference ? referenceColor : colors[idx % colors.length];
                        }),
                        borderRadius: 4,
                    }))
                };

                if (queryPerformanceChart) queryPerformanceChart.destroy();
                queryPerformanceChart = new Chart(queryPerfCtx, {
                    type: 'bar',
                    data: chartData,
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false,
                        },
                        plugins: {
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: { display: true, text: 'Time (ms)' }
                            }
                        }
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const mediaQuery = window.matchMedia('(min-width: 601px)');
            
            function handleScreenChange(e) {
                if (state.isWideScreen !== e.matches) {
                    state.isWideScreen = e.matches;
                    render();
                }
            }

            mediaQuery.addEventListener('change', handleScreenChange);

            loadAllResults();
        });
    </script>
</body>
</html>
